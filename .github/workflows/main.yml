name: .NET 10 CI

on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - dev
      - main

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'S13MauricioCV.ReportData.sln'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-build

      - name: Publish Main Project
        run: dotnet publish S13MauricioCV.ReportData/S13MauricioCV.ReportData.csproj \
          --configuration Release \
          --output ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application
          path: ./publish
